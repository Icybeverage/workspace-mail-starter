services:
  neo4j:
    image: neo4j:2026.08.0
    environment:
      NEO4J_AUTH_FILE: /run/secrets/neo4j_auth
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    secrets:
      - neo4j_auth
secrets:
  neo4j_auth:
    file: ./secrets/neo4j_auth.txt
volumes:
  neo4j_data:
